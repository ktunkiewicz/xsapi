        bank:
          $ref: "#/components/schemas/BankQuoteObject"
        totalSavings:
          $ref: "#/components/schemas/TotalSavingsObject"
        smartRates:
          $ref: "#/components/schemas/ComparisonQuoteSmartRateEntity"
        _embedded:
          $ref: "#/components/schemas/ComparisonQuoteEmbedded"
      required:
        - currencyFrom
