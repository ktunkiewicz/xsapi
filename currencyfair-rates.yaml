        - name
        - dialCode
        - allowsRegistration
        - registrationMessage
    CountriesCollection:
      type: object
      properties:
        _embedded:
          type: object
          properties:
            countries:
              type: array
              items:
                $ref: "#/components/schemas/CountriesEntity"
          required:
            - countries
        total_items:
          type: integer
      required:
        - _embedded
        - total_items
    CurrenciesEntity:
      type: object
      properties:
        currencyCode:
          $ref: "#/components/schemas/CurrencyCode"
        description:
          type: string
          description: Currency name.
          example: Euro
        minimumSellAmount:
          type: number
          format: float
          description: Minimum amount that can be sold when exchanging.
          example: 10
        minDeposit:
          type: number
          format: float
          description: Minimum amount that can be deposited.
          example: 10
        maxDeposit:
          type: number
          format: float
          description: Maximum amount that can be deposited.
          example: 100000
        roundingScale:
          type: number
          description: Number of decimal places to round amounts in this currency.
            Rounding method is "half up".
          example: 2
        marketplaceEnabled:
          type: boolean
          description: Is marketplace trading allowed for this currency.
          example: true
        aqtOnly:
          type: boolean
          description: Is this an Automatic Quick Trade (aka. Send Money) only currency.
          example: false
        buyOnly:
          type: boolean
          description: Is this a buy only currency. Cannot be sold on the Exchange.
          example: false
        acceptDeposits:
          type: boolean
          description: Do we accept deposits in this currency.
          example: true
        targetCurrencies:
          description: A list of currencies which this currency can be exchanged for.
          type: array
          items:
            $ref: "#/components/schemas/CurrenciesEntitySimplified"
      required:
        - currencyCode
        - description
        - minimumSellAmount
        - roundingScale
        - minDeposit
        - maxDeposit
        - marketplaceEnabled
        - aqtOnly
        - buyOnly
        - acceptDeposits
        - targetCurrencies
    CurrenciesEntitySimplified:
      type: object
      properties:
        currencyCode:
          $ref: "#/components/schemas/CurrencyCode"
      required:
        - currencyCode
    CurrenciesCollection:
      type: object
      properties:
        _embedded:
          type: object
          properties:
            currencies:
